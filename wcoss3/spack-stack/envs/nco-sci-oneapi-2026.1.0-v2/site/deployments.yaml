deployments:

  - template: "nco-core"
    compilers: ["gcc@11.5.0"]
    duplicates_to_ignore: ["crtm-fix"]

  - template: "nco-sci"
    roots_as_externals_from:
      env: "nco-core%gcc@11.5.0"
      specs:
      - cmake
      - crtm-fix
      - git
      - git-lfs
      - gmake
      - perl
      - motif
      - libxt
      - libsm
      - libxtst
      - libice
      - libxi
      - libxext
      - libx11
      - xproto
    compilers: ["oneapi@2026.1.0", "intel@2021.10.0", "gcc@11.5.0"]
    duplicates_to_ignore: ["crtm", "crtm-fix"]
    exclude_includes: ["common/packages_oneapi.yaml"]
    write_metamodules: false
    allowed_gcc_packages:
    - antlr # when intel oneapi
    - bison # when intel oneapi
    - gettext # when intel classic
    - libbsd # when intel oneapi
    walltime: 03:15:00
