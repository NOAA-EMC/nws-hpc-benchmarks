packages:
  #
  ### Compilers
  #
  c:
    require: ['gcc@11.5.0']
  cxx:
    require: ['gcc@11.5.0']
  fortran:
    require: ['gcc@11.5.0']
  gcc:
    buildable: false
    externals:
    - spec: gcc@11.5.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc
          cxx: /usr/bin/g++
          fortran: /usr/bin/gfortran
  gcc-runtime:
    require: '%gcc@11.5.0'
  #
  ### Provider settings & externals
  #
  mpi:
    require: ['openmpi']
    buildable: false
  openmpi:
    externals:
    - spec: openmpi@4.1.1+atomics~cuda+cxx~cxx_exceptions+java~memchecker+pmi~rocm~static~wrapper-rpath fabrics=ofi,psm2,ucx schedulers=slurm
      prefix: /usr/lib64/openmpi
      modules: [mpi/openmpi-x86_64]
